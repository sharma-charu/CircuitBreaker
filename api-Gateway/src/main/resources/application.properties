spring.application.name=api-Gateway
server.port=${PORT:8080}

# Eureka Server Configuration (dynamic with fallback)
eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# ==========================================
# Gateway Routes
# ==========================================

# Route 0: Inventory Service
spring.cloud.gateway.server.webflux.routes[0].id=inventory-service
spring.cloud.gateway.server.webflux.routes[0].uri=lb://INVENTORY-SERVICE
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/inventory/**

# Route 1: Recommendation Service (Protected with Circuit Breaker)
spring.cloud.gateway.server.webflux.routes[1].id=recommendation-service
spring.cloud.gateway.server.webflux.routes[1].uri=lb://RECOMMENDATION-SERVICE
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/recommendations/**,/recommendations/**
spring.cloud.gateway.server.webflux.routes[1].filters[0].name=CircuitBreaker
spring.cloud.gateway.server.webflux.routes[1].filters[0].args.name=recommendationCB
spring.cloud.gateway.server.webflux.routes[1].filters[0].args.fallbackUri=forward:/fallback/recommendations
spring.cloud.gateway.server.webflux.routes[1].filters[0].args.statusCodes=500,502,503,504

# Route 2: Product Service
spring.cloud.gateway.server.webflux.routes[2].id=product-service
spring.cloud.gateway.server.webflux.routes[2].uri=lb://PRODUCT-SERVICE
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/products/**

# ==========================================
# Resilience4j Circuit Breaker & Time Limiter Configuration
# ==========================================
resilience4j.circuitbreaker.instances.recommendationCB.sliding-window-size=10
resilience4j.circuitbreaker.instances.recommendationCB.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.recommendationCB.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.recommendationCB.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.recommendationCB.automatic-transition-from-open-to-half-open-enabled=true

resilience4j.timelimiter.instances.recommendationCB.timeout-duration=3s

# ==========================================
# Resilience4j Rate Limiter & Bulkhead Configuration
# ==========================================
resilience4j.ratelimiter.instances.gatewayRateLimiter.limit-for-period=20
resilience4j.ratelimiter.instances.gatewayRateLimiter.limit-refresh-period=1s
resilience4j.ratelimiter.instances.gatewayRateLimiter.timeout-duration=0s

resilience4j.bulkhead.instances.gatewayBulkhead.max-concurrent-calls=25
resilience4j.bulkhead.instances.gatewayBulkhead.max-wait-duration=100ms

# ==========================================
# Distributed Tracing Configuration (Micrometer + Zipkin)
# ==========================================
management.tracing.sampling.probability=${TRACING_SAMPLING_PROBABILITY:1.0}
management.zipkin.tracing.endpoint=${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}

# ==========================================
# Global CORS Configuration (for React UI Dashboard)
# ==========================================
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-origins=http://localhost:3000,http://localhost:5173
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-headers=*
spring.cloud.gateway.globalcors.cors-configurations.[/**].allow-credentials=true

# ==========================================
# Actuator & Health Endpoints
# ==========================================
management.endpoints.web.exposure.include=health,info,gateway,circuitbreakers,circuitbreakerevents,ratelimiters,bulkheads
management.endpoint.health.show-details=always
management.health.circuitbreakers.enabled=true
management.health.ratelimiters.enabled=true
management.endpoints.web.cors.allowed-origins=http://localhost:3000,http://localhost:5173
management.endpoints.web.cors.allowed-methods=GET,POST,OPTIONS
management.endpoints.web.cors.allowed-headers=*